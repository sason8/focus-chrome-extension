name: Package Chrome Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Create Zip Package
      run: |
        zip -r focusflow-extension.zip manifest.json background.js popup.html popup.js popup.css options.html options.js icon.png LICENSE README.md

    - name: Upload Extension Artifact
      uses: actions/upload-artifact@v3
      with:
        name: focusflow-chrome-extension
        path: focusflow-extension.zip
