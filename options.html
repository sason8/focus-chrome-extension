<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FocusFlow Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #c084fc;
      --primary-hover: #a855f7;
      --red: #f43f5e;
      --green: #10b981;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      background-image: radial-gradient(circle at 50% -20%, #1e1b4b, #0f172a 80%);
      margin: 0;
      padding: 3rem 1.5rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 800px;
      max-width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #c084fc 0%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 0.5rem 0;
    }

    header p {
      color: var(--text-muted);
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      font-size: 1.25rem;
      margin-top: 0;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .form-group input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.75rem;
      color: white;
      outline: none;
      box-sizing: border-box;
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .btn {
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    /* List styling */
    .list {
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 1.25rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: rgba(0, 0, 0, 0.15);
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-item-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
    }

    .list-item-btn:hover {
      color: var(--red);
    }

    /* Stats display */
    .stats-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .stat-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .stat-bar-container {
      height: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
      width: 0;
      transition: width 0.5s ease-out;
    }

    .empty-stats {
      text-align: center;
      color: var(--text-muted);
      padding: 2rem 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚙️ FocusFlow Dashboard</h1>
      <p>Configure your dynamic blocking filters and manage your focus sessions.</p>
    </header>

    <div class="grid">
      <!-- Pomodoro Durations -->
      <div class="card">
        <h2>⏱️ Timer Settings</h2>
        <form id="settingsForm">
          <div class="form-group">
            <label for="focusDurationInput">Focus Duration (minutes)</label>
            <input type="number" id="focusDurationInput" min="1" max="180">
          </div>
          <div class="form-group">
            <label for="breakDurationInput">Break Duration (minutes)</label>
            <input type="number" id="breakDurationInput" min="1" max="60">
          </div>
          <button type="submit" class="btn">Save Configurations</button>
        </form>
      </div>

      <!-- Blocklist Manager -->
      <div class="card">
        <h2>🛡️ Blocklist Manager</h2>
        <div class="list" id="blockedList">
          <!-- Populated dynamically -->
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="newSiteInput" placeholder="Add site to block (e.g. reddit.com)" style="flex: 1;">
            <button id="addSiteBtn" class="btn" style="width: auto; padding: 0.75rem 1.25rem;">Add</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Statistics -->
    <div class="card">
      <h2>📊 Blocked Attempts Insights</h2>
      <div id="statsPlaceholder" class="empty-stats">
        No stats recorded yet. Keep focusing!
      </div>
      <div class="stats-container" id="statsContainer" style="display: none;">
        <!-- Populated dynamically -->
      </div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
