<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">
        <span class="logo-icon">⏳</span>
        <h2>FocusFlow</h2>
      </div>
      <button id="optionsLink" class="options-btn" title="Open Dashboard">⚙️</button>
    </div>

    <!-- Pomodoro Timer Widget -->
    <div class="timer-widget">
      <div id="timerMode" class="timer-mode">FOCUS</div>
      <div id="timerDisplay" class="timer-display">25:00</div>
      <div class="timer-controls">
        <button id="startTimerBtn" class="btn btn-primary">Start Focus</button>
        <button id="resetTimerBtn" class="btn btn-secondary">Reset</button>
      </div>
    </div>

    <!-- Block List Quick Control -->
    <div class="block-controls">
      <div class="control-row">
        <span>Blocklist Blocker</span>
        <label class="switch">
          <input type="checkbox" id="blockToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div class="quick-add-form">
        <input type="text" id="siteInput" placeholder="Block website (e.g. reddit.com)">
        <button id="addSiteBtn">+</button>
      </div>
      
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <div class="footer">
      <a href="#" id="manageLink">Open Settings Dashboard &rarr;</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
